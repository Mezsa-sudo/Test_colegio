<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué especialidad elegir? – IPET 57</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* ===== MODO CLARO (tonos púrpura suaves) ===== */
  --bg: #f6f2ff;
  --card: rgba(255, 255, 255, 0.94);
  --text: #2a2340;
  --muted: #6f6690;
  --line: #e3dbfa;
  --accent: #7c5cf0;
  --accent-soft: #f0eaff;
  --btn-a: #7c5cf0;
  --btn-b: #a58bff;
  --h1-a: #6d4fe0;
  --h1-b: #b08cf5;
  --ok: #15803d;
  --ok-bg: #e7f7ed;
  --mid: #a16207;
  --mid-bg: #fdf3d8;
  --bad: #b91c1c;
  --bad-bg: #fdeaea;
  --shadow: 0 10px 34px rgba(124, 92, 240, 0.13);
  /* ==== IMAGEN DE FONDO GENERAL ==== */
  --bg-image: url('img/fondo_colegio.jpg');
  --overlay: rgba(246, 242, 255, 0.9);
  --font-titulo: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-texto: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== MODO OSCURO (automático según el dispositivo) ===== */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14101f;
    --card: rgba(30, 24, 48, 0.94);
    --text: #efeaff;
    --muted: #a79fc4;
    --line: #372d57;
    --accent: #a78bfa;
    --accent-soft: #2a2145;
    --h1-a: #b9a2ff;
    --h1-b: #e0d0ff;
    --ok: #6ee7a0;
    --ok-bg: #12301f;
    --mid: #fcd34d;
    --mid-bg: #3a2f10;
    --bad: #fca5a5;
    --bad-bg: #3a1717;
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    --overlay: rgba(20, 16, 31, 0.9);
  }
}

/* ===== MODO OSCURO (manual, con el botón) ===== */
:root[data-theme="dark"] {
  --bg: #14101f;
  --card: rgba(30, 24, 48, 0.94);
  --text: #efeaff;
  --muted: #a79fc4;
  --line: #372d57;
  --accent: #a78bfa;
  --accent-soft: #2a2145;
  --h1-a: #b9a2ff;
  --h1-b: #e0d0ff;
  --ok: #6ee7a0;
  --ok-bg: #12301f;
  --mid: #fcd34d;
  --mid-bg: #3a2f10;
  --bad: #fca5a5;
  --bad-bg: #3a1717;
  --shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
  --overlay: rgba(20, 16, 31, 0.9);
}

html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 420px at 8% -8%, rgba(167, 139, 250, 0.32), transparent 70%),
    radial-gradient(700px 380px at 100% 0%, rgba(196, 164, 255, 0.22), transparent 70%),
    linear-gradient(var(--overlay), var(--overlay)),
    var(--bg-image);
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-texto);
  line-height: 1.5;
}

.wrap { max-width: 960px; margin: 0 auto; padding: 22px 16px 36px; }

/* ===== Encabezado ===== */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 {
  font-family: var(--font-titulo);
  font-weight: 800;
  font-size: 2rem;
  line-height: 1.1;
  margin: 0 0 4px;
  background: linear-gradient(90deg, var(--h1-a), var(--h1-b));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub { color: var(--muted); margin: 0 0 18px; }
.top .sub { margin: 0; font-size: .95rem; }
.pill {
  flex: none;
  font: inherit;
  font-size: .85rem;
  font-weight: 700;
  color: var(--text);
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: border-color .15s;
}
.pill:hover { border-color: var(--accent); }
.session {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: .9rem; color: var(--muted); margin: 0 0 14px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 6px 8px 6px 14px; width: fit-content; max-width: 100%;
}
.session b { color: var(--text); }
.link { font: inherit; font-size: .85rem; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0 6px; cursor: pointer; text-decoration: underline; }

/* ===== Distribución: mascota al lado + contenido ===== */
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: start; }
.content { min-width: 0; }

/* ===== MASCOTA (contenedor de imagen, visible en toda la página) ===== */
.mascota-col {
  position: sticky;
  top: calc(16px + env(safe-area-inset-top, 0px));
  display: grid;
  gap: 14px;
  justify-items: center;
}
.mascota {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 30px;
  background-color: var(--card);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  border: 2px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.m-login { background-image: url('img/mascota_test.png'); }
.m-home  { background-image: url('img/gato_programacion.png'); }
.m-q     { background-image: url('img/mascota_test.png'); }
.m-ex    { background-image: url('img/gato_programacion.png'); }
.m-fin   { background-image: url('img/mascota_test.png'); }

.mascota .ph {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; text-align: center; padding: 10px;
  color: var(--muted); font-weight: 700; font-size: .9rem;
}
.mascota .ph span { font-size: 2.2rem; line-height: 1; }
.mascota .ph small { font-weight: 400; font-size: .72rem; }
.mascota-col.sin-img .mascota { border-style: dashed; }
.mascota-col.sin-img .ph { display: flex; }
.mascota.rebota { animation: rebota .45s ease; }
@keyframes rebota {
  0% { transform: translateY(0) rotate(0); }
  35% { transform: translateY(-8px) rotate(-2deg); }
  70% { transform: translateY(0) rotate(1.5deg); }
  100% { transform: translateY(0) rotate(0); }
}

.bubble {
  position: relative;
  margin: 0;
  width: 100%;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
  font-size: .9rem;
  font-weight: 600;
  text-align: center;
  box-shadow: var(--shadow);
}
.bubble::before {
  content: "";
  position: absolute;
  top: -7px; left: 50%; margin-left: -6px;
  width: 12px; height: 12px;
  background: var(--card);
  border-left: 1.5px solid var(--line);
  border-top: 1.5px solid var(--line);
  transform: rotate(45deg);
}

/* ===== Tarjetas ===== */
.card {
  position: relative;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 26px 24px 24px;
  overflow: hidden;
  box-shadow: var(--shadow);
  backdrop-filter: blur(6px);
}
#box::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, var(--btn-a), var(--btn-b));
}

.paso { animation: aparece .25s ease; }
@keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.prog { position: relative; height: 10px; background: var(--line); border-radius: 10px; margin: 0 0 20px; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--btn-a), var(--btn-b)); border-radius: 10px; transition: width .3s; }
.prog .mk {
  position: absolute; top: 50%;
  width: 16px; height: 16px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--card);
  border: 2.5px solid var(--accent);
}
.prog .mk.hecho { background: var(--accent); }
.count { font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.tema { display: inline-block; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 11px; margin: 0 0 8px; }
.q { font-family: var(--font-titulo); font-size: 1.4rem; font-weight: 600; margin: 0 0 18px; line-height: 1.25; }

.opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  font: inherit; color: inherit;
  background: transparent;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s;
}
.ltr {
  flex: none;
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 10px;
  font-weight: 800;
  background: var(--accent-soft);
  color: var(--accent);
  transition: background .15s, color .15s;
}
.opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
.opt:not(:disabled):hover .ltr { background: var(--accent); color: #fff; }
.opt:disabled { cursor: default; opacity: .75; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); opacity: 1; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: 1; }

.btn {
  font: inherit; font-weight: 800;
  background: linear-gradient(135deg, var(--btn-a), var(--btn-b));
  color: #fff;
  border: 0; border-radius: 14px;
  padding: 12px 22px;
  cursor: pointer;
  margin-top: 8px;
  box-shadow: 0 6px 16px rgba(124, 92, 240, 0.28);
  text-decoration: none;
  display: inline-block;
  transition: transform .15s;
}
.btn:not(:disabled):hover { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); box-shadow: none; }
.btn.ghost:not(:disabled):hover { border-color: var(--accent); }
.big { font-size: 1.08rem; padding: 15px 28px; width: 100%; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }
.navrow { margin-top: 6px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.home p { margin: 0 0 14px; }
.home h2 { font-family: var(--font-titulo); font-size: 1.6rem; margin: 0 0 8px; line-height: 1.15; }
.datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 16px; }
.dato { background: var(--accent-soft); border-radius: 16px; padding: 12px 8px; text-align: center; }
.dato b { display: block; font-family: var(--font-titulo); font-size: 1.7rem; line-height: 1; color: var(--accent); }
.dato span { font-size: .8rem; color: var(--muted); font-weight: 700; }

/* ===== Inicio de sesión ===== */
.login h2 { font-family: var(--font-titulo); margin: 0 0 4px; font-size: 1.6rem; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 5px; }
.field input, .numrow input {
  width: 100%;
  font: inherit; color: var(--text);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
}
.field input:focus, .numrow input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.err { min-height: 1.2em; color: var(--bad); font-size: .88rem; margin: -4px 0 6px; }

/* ===== Mini desafíos ===== */
.code {
  margin: 0 0 14px; padding: 14px 16px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: .92rem;
  overflow-x: auto; white-space: pre;
}
.lab2 { font-size: .85rem; font-weight: 800; color: var(--muted); margin: 10px 0 6px; }
.pool { display: grid; gap: 8px; }
.step {
  font: inherit; color: inherit; text-align: left;
  background: var(--accent-soft); border: 1.5px solid transparent; border-radius: 14px;
  padding: 11px 13px; cursor: pointer;
}
.step:hover { border-color: var(--accent); }
.muted { color: var(--muted); font-size: .9rem; }
.mine { margin: 0; padding-left: 24px; display: grid; gap: 6px; }
.mine li { padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 12px; }
.mine li.empty { list-style: none; margin-left: -24px; color: var(--muted); border-style: dashed; }
.mine li.good { border-color: var(--ok); background: var(--ok-bg); }
.mine li.badp { border-color: var(--bad); background: var(--bad-bg); }
.numrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.numrow input { flex: 1 1 140px; width: auto; }
.numrow .btn { margin-top: 0; }
.unit { font-weight: 800; color: var(--muted); }
.fb { margin-top: 12px; border-radius: 14px; padding: 0; font-size: .95rem; }
.fb:not(:empty) { padding: 11px 13px; background: var(--accent-soft); }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.mid { background: var(--mid-bg); color: var(--mid); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb ol { margin: 6px 0 0; padding-left: 22px; color: var(--text); }

/* ===== IMÁGENES CONTENEDORES ===== */
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
.contenedor { aspect-ratio: 1/1; border-radius: 18px; background-color: var(--line); background-size: cover; background-position: center; background-repeat: no-repeat; }

.img-inicio-1 { background-image: url('img/programa.png'); }
.img-inicio-2 { background-image: url('img/images.png'); }
.img-inicio-3 { background-image: url('img/automotor.png'); }

.img-p-1 { background-image: url('img/programa.png'); }
.img-p-2 { background-image: url('img/img/gato_programacion.png'); }

.img-e-1 { background-image: url('img/images.png'); }
.img-e-2 { background-image: url('img/electricidad_meme.png'); }

.img-a-1 { background-image: url('img/automotor.png'); }
.img-a-2 { background-image: url('img/img/gato_mecanico.png'); }

/* ===== Barras de estadísticas al final ===== */
#stats { margin-top: 18px; text-align: center; }
#stats h3 { font-family: var(--font-titulo); font-size: 1.2rem; margin: 0 0 14px; }
.row { margin-bottom: 12px; text-align: left; }
.lab { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
.track { height: 14px; background: var(--line); border-radius: 8px; overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 8px; transition: width .6s ease; }
.nota { font-size: .8rem; color: var(--muted); margin: 12px 0 0; }

/* ===== Vista de resultados ===== */
.hero { position: relative; margin: -26px -24px 20px; padding: 34px 20px; color: #fff; text-align: center; }
.hero .em { font-size: 3.2rem; line-height: 1; }
.hero h2 { font-family: var(--font-titulo); margin: 8px 0 4px; font-size: 2rem; }
.hero p { margin: 0; opacity: .95; }
.res h3 { font-family: var(--font-titulo); margin: 20px 0 6px; font-size: 1.15rem; }
.res ul { margin: 0; padding-left: 20px; }
.res li { margin-bottom: 4px; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
.frase {
  margin: 18px 0; padding: 14px 16px;
  border-left: 5px solid;
  background: var(--accent-soft);
  border-radius: 14px;
  font-size: 1.25rem; font-weight: 800; letter-spacing: .01em;
}
.frase cite { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-top: 4px; font-style: normal; }
.tag { display: inline-block; border-radius: 999px; padding: 4px 13px; font-size: .82rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); margin-bottom: 10px; }
.tag.neutro { background: linear-gradient(135deg, var(--btn-a), var(--btn-b)); }
.res ul.ejlist { list-style: none; padding: 0; display: grid; gap: 6px; }
.ejlist li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 9px 11px; border: 1px solid var(--line); border-radius: 12px; margin: 0; }
.ejlist small { color: var(--muted); }
.aviso { margin: 16px 0 0; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--accent-soft); font-size: .92rem; }
.contacto { margin-top: 22px; padding-top: 14px; border-top: 1.5px dashed var(--line); text-align: center; }
.contacto h3 { margin: 0 0 4px; }
.contacto h4, .contacto h5 { margin: 4px 0; font-weight: 700; }
.contacto a { color: var(--accent); }

/* ===== Pie de página ===== */
.foot { margin-top: 26px; text-align: center; font-size: .85rem; color: var(--muted); }
.foot .j { color: var(--accent); font-weight: 800; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ===== Celulares: la mascota pasa arriba, al costado de su globo de texto ===== */
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; gap: 16px; }
  .mascota-col {
    position: static;
    grid-template-columns: 92px 1fr;
    align-items: center;
    justify-items: stretch;
    gap: 14px;
  }
  .mascota { border-radius: 22px; }
  .bubble { text-align: left; }
  .bubble::before {
    top: 50%; left: -7px; margin: -6px 0 0 0;
    transform: rotate(-45deg);
  }
  h1 { font-size: 1.6rem; }
}
@media (max-width: 440px) {
  .card { padding: 22px 16px 20px; }
  .hero { margin: -22px -16px 18px; }
  .q { font-size: 1.25rem; }
  .datos { grid-template-columns: 1fr; }
}
</style>

<body>

<main class="wrap">
  <header class="top">
    <div>
      <h1>¿Qué especialidad elegir?</h1>
      <p class="sub">IPET 57 · Comodoro Martín Rivadavia — Test orientativo para 3er año.</p>
    </div>
    <button class="pill" id="theme" type="button"></button>
  </header>

  <div class="session" id="who" hidden>
    <span>👤 <b id="whoname"></b></span>
    <button class="link" id="logout" type="button">Cerrar sesión</button>
  </div>

  <div class="layout">
    <!-- MASCOTA: aparece al costado en todas las pantallas -->
    <aside class="mascota-col" id="mcol">
      <div class="mascota m-login" id="mascota" role="img" aria-label="Mascota del test">
        <div class="ph"><span>🐾</span>Tu mascota va acá<small>img/mascota.png</small></div>
      </div>
      <p class="bubble" id="bubble" aria-live="polite"></p>
    </aside>

    <section class="content">
      <div class="card" id="box"></div>
      <div class="card" id="stats" hidden><h3>Afinidad orientativa obtenida:</h3></div>
    </section>
  </div>

  <footer class="foot">Página/Test hecho por Julian Rafael Meza y la sutil <span class="j">J</span></footer>
</main>

<script>
/* ===== CONFIGURACIÓN ===== */
const CONFIG = {
  PESO_TEST: 0.7,        // cuánto pesan las preguntas en el resultado
  PESO_PRACTICA: 0.3,    // cuánto pesan los mini desafíos
  DESAFIO_CADA: 5,       // aparece un mini desafío cada tantas preguntas
  AVISO_NEUTRO: 12       // si elegís tantas opciones "D" o más, aparece un aviso de perfil no técnico
};

const SP = {
  p: {
    n: "Programación",
    c: "#7c3aed",
    g: "linear-gradient(135deg,#7c3aed,#4f46e5)",
    em: "💻",
    lema: "Crear con lógica, estructuras y sistemas",
    frase: ["BITE ME", "Uzi"],
    d: "Tenés inclinación por el razonamiento abstracto, la resolución de problemas lógicos y el modelado de datos para crear soluciones digitales dinámicas.",
    ap: ["Lógica algorítmica y estructuras de control", "Desarrollo de software, sitios web e interfaces interactivas", "Gestión de bases de datos y arquitectura de sistemas"],
    sal: ["Desarrollador/a de software y aplicaciones", "Especialista en desarrollo web y bases de datos", "Soporte de sistemas y arquitectura de código"]
  },
  e: {
    n: "Electrónica",
    c: "#eab308",
    g: "linear-gradient(135deg,#eab308,#f97316)",
    em: "🔌",
    lema: "Controlar el flujo de señales y componentes",
    frase: ["Si quieres encontrar los secretos del universo, piensa en términos de energía, frecuencia y vibración.", "Nikola Tesla"],

function calcular() {
  const R = {};
  for (const k in SP) {
    const q = sc[k] / (N * PTS_MAX);
    const ex = ejRes.filter(r => r.esp === k);
    const p = ex.length ? ex.reduce((s, r) => s + r.pts, 0) / ex.length : 0;
    R[k] = { q, p, total: CONFIG.PESO_TEST * q + CONFIG.PESO_PRACTICA * p };
  }
  return R;
}
const ganador = R => Object.keys(R).sort((a, b) => (R[b].total - R[a].total) || (R[b].q - R[a].q))[0];
function bars(R) {
  for (const k in R) {
    const w = Math.round(R[k].total * 100);
    document.getElementById("f" + k).style.width = w + "%";
    document.getElementById("v" + k).textContent = w + "%";
  }
}

/* ===== Barra de progreso con marcas de mini desafío ===== */
function prog() {
  const marcas = FLOW.map((f, idx) => f.t === "ex"
    ? `<b class="mk ${idx < paso ? "hecho" : ""}" style="left:${((idx + 0.5) / FLOW.length) * 100}%" title="Mini desafío"></b>`
    : "").join("");
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${FLOW.length}" aria-valuenow="${paso}"><i style="width:${(paso / FLOW.length) * 100}%"></i>${marcas}</div>`;
}

/* ===== 1) Inicio de sesión ===== */
function login() {
  user = null;
  st.hidden = true;
  who.hidden = true;
  mascota("login", "¡Hola! Soy tu guía. Poné tu nombre y arrancamos.");
  box.innerHTML = `
    <div class="login paso">
      <h2>Iniciá sesión</h2>
      <p class="sub">Ingresá tus datos para empezar el test.</p>
      <form id="lf" novalidate>
        <label class="field"><span>Nombre y apellido</span>
          <input id="ln" type="text" autocomplete="name" maxlength="60" placeholder="Ej: Catherine Portillo"></label>
        <label class="field"><span>Curso y división (opcional)</span>
          <input id="lc" type="text" maxlength="20" placeholder="Ej: 3° 2ª"></label>
        <div class="err" id="lerr" role="alert"></div>
        <button class="btn big" type="submit">Ingresar</button>
      </form>
    </div>
  `;
  document.getElementById("lf").onsubmit = ev => {
    ev.preventDefault();
    const nombre = document.getElementById("ln").value.trim();
    const curso = document.getElementById("lc").value.trim();
    const err = document.getElementById("lerr");
    if (nombre.length < 2) { err.textContent = "Escribí tu nombre y apellido."; return; }
    user = { nombre, curso };
    document.getElementById("whoname").textContent = nombre;
    who.hidden = false;
    reiniciar();
  };
}
document.getElementById("logout").onclick = login;

function reiniciar() {
  sc.p = sc.e = sc.a = 0;
  paso = 0; ejRes = []; ejHechos = {}; resp = []; ordenes = {}; dCount = 0;
  home();
}

/* ===== 2) Pantalla de inicio ===== */
function home() {
  st.hidden = true;
  const nombre = esc(user.nombre.split(" ")[0]);
  mascota("home", "Acá no hay respuestas malas. Elegí lo que más se parezca a vos.");
  box.innerHTML = `
    <div class="home paso">
      <h2>¡Hola, ${nombre}!</h2>
      <p>Estás en 3er año y en 4to vas a elegir tu orientación técnica. Este test te ayuda a descubrir cuál se parece más a vos: <b>Programación</b>, <b>Electrónica</b> o <b>Automotor</b>.</p>
      <div class="datos">
        <div class="dato"><b>${N}</b><span>preguntas</span></div>
        <div class="dato"><b>${EX.length}</b><span>mini desafíos</span></div>
        <div class="dato"><b>~10</b><span>minutos</span></div>
      </div>
      <p class="muted">Los mini desafíos van apareciendo en el medio de las preguntas. Son cortitos y tenés una pista si te trabás. Si te equivocás al tocar una respuesta, podés volver a la pregunta anterior.</p>
      <button class="btn big" id="go">Iniciar test orientativo</button>
      <div class="slots">
        <div class="contenedor img-inicio-1"></div>
        <div class="contenedor img-inicio-2"></div>
        <div class="contenedor img-inicio-3"></div>
      </div>
    </div>
  `;
  document.getElementById("go").onclick = avanzar;
}

/* ===== 3) Recorrido mezclado ===== */
function avanzar() {
  // si un mini desafío ya se resolvió (porque volviste atrás), no se repite
  while (paso < FLOW.length && FLOW[paso].t === "ex" && ejHechos[FLOW[paso].k]) paso++;
  if (paso >= FLOW.length) return end();
  const f = FLOW[paso];
  if (f.t === "q") showQ(f.k); else showEx(f.k);
}

/* ===== Volver a la pregunta anterior ===== */
function hayAnterior() {
  for (let j = paso - 1; j >= 0; j--) if (FLOW[j].t === "q") return true;
  return false;
}
function sumar(letra, signo) {
  for (const k in sc) sc[k] += signo * PTS[letra][k];
  if (letra === "D") dCount += signo;
}
function atras() {
  let j = paso - 1;
  while (j >= 0 && FLOW[j].t !== "q") j--;
  if (j < 0) return;
  if (resp[j]) { sumar(resp[j], -1); resp[j] = undefined; }
  paso = j;
  avanzar();
}
function btnAtras() {
  return `<div class="acts navrow"><button type="button" class="btn ghost" id="back" ${hayAnterior() ? "" : "disabled"}>← Pregunta anterior</button></div>`;
}

function showQ(k) {
  const [tema, q, o] = Q[k];
  if (!ordenes[k]) ordenes[k] = Object.keys(o).sort(() => Math.random() - .5);
  const ks = ordenes[k];
  const dice = k === Math.floor(N / 2) ? "¡Ya pasaste la mitad de las preguntas!" :
               k === N - 1 ? "¡Última pregunta!" : DICE_Q[k % DICE_Q.length];
  mascota("q", dice);
  box.innerHTML = `
    <div class="paso">
      <div class="count">Pregunta ${k + 1} de ${N}</div>
      ${prog()}
      <span class="tema">${esc(tema)}</span>
      <p class="q">${esc(q)}</p>
      <div id="ops"></div>
      ${btnAtras()}
    </div>
  `;
  const ops = document.getElementById("ops");
  ks.forEach((key, n) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="ltr">${"ABCD"[n]}</span><span>${esc(o[key])}</span>`;
    b.onclick = () => {
      resp[paso] = key;
      sumar(key, 1);
      paso++;
      avanzar();
    };
    ops.appendChild(b);
  });
  document.getElementById("back").onclick = atras;
}

/* ===== 4) Mini desafíos ===== */
function showEx(k) {
  const e = EX[k], t0 = Date.now();
  let intentos = 0, hecho = false;

  mascota("ex", "¡Mini desafío! Es más fácil de lo que parece.");
  box.innerHTML = `
    <div class="paso">
      <div class="count">Mini desafío ${k + 1} de ${EX.length}</div>
      ${prog()}
      <span class="tag neutro">⭐ ${esc(e.t)}</span>
      <p class="q">${esc(e.q)}</p>
      ${e.tipo === "orden" ? '<p class="muted">Tocá los pasos en el orden correcto.</p>' : ""}
      <div id="exb"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="acts" id="exn"></div>
      ${btnAtras()}
    </div>
  `;
  document.getElementById("back").onclick = atras;
  const exb = document.getElementById("exb");
  const fb = document.getElementById("fb");
  const exn = document.getElementById("exn");
  const msg = (html, cls) => { fb.className = "fb " + (cls || ""); fb.innerHTML = html; };
  const fin = (pts, detalle) => {
    if (hecho) return;
    hecho = true;
    ejHechos[k] = true;
    ejRes.push({ id: e.id, esp: e.esp, t: e.t, pts, intentos, seg: Math.max(1, Math.round((Date.now() - t0) / 1000)), detalle });
    decir(pts >= 1 ? "¡Bien ahí! 🎉" : pts > 0 ? "¡Casi! Pero lo lograste." : "No pasa nada, seguimos.");
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = paso + 1 >= FLOW.length ? "Ver mi resultado" : "Siguiente";
    b.onclick = () => { paso++; avanzar(); };
    exn.appendChild(b);
    b.focus();
  };

  if (e.tipo === "orden") {
    const n = e.pasos.length;
    const pool = e.pasos.map((_, i) => i).sort(() => Math.random() - .5);
    let sel = [];
    const comprobar = () => {
      intentos = 1;
      const ok = sel.filter((x, p) => x === p).length;
      exb.innerHTML = `<ol class="mine">${sel.map((x, p) => `<li class="${x === p ? "good" : "badp"}">${esc(e.pasos[x])} ${x === p ? "✓" : "✗"}</li>`).join("")}</ol>`;
      msg(`Acertaste ${ok} de ${n} pasos en su lugar.` + (ok < n ? `<br>Orden correcto:<ol>${e.pasos.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : " ¡Excelente!"), ok === n ? "ok" : ok >= n / 2 ? "mid" : "bad");
      fin(ok / n, `${ok}/${n} pasos en su lugar`);
    };
    const draw = () => {
      const libres = pool.filter(x => !sel.includes(x));
      exb.innerHTML = `
        <div class="lab2">Pasos disponibles</div>
        <div class="pool">${libres.map(x => `<button type="button" class="step" data-k="${x}">${esc(e.pasos[x])}</button>`).join("") || '<span class="muted">Ya usaste todos los pasos.</span>'}</div>
        <div class="lab2">Tu orden</div>
        <ol class="mine">${sel.length ? sel.map(x => `<li>${esc(e.pasos[x])}</li>`).join("") : '<li class="empty">Tocá los pasos en el orden correcto…</li>'}</ol>
        <div class="acts">
          <button type="button" class="btn ghost" id="und" ${sel.length ? "" : "disabled"}>Deshacer</button>
          <button type="button" class="btn" id="chk" ${sel.length === n ? "" : "disabled"}>Comprobar</button>
        </div>`;
      exb.querySelectorAll(".step").forEach(b => b.onclick = () => { sel.push(+b.dataset.k); draw(); });
      exb.querySelector("#und").onclick = () => { sel.pop(); draw(); };
      exb.querySelector("#chk").onclick = comprobar;
    };
    draw();

  } else if (e.tipo === "num") {
    exb.innerHTML = `
      <div class="numrow">
        <input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="Tu respuesta" aria-label="Tu respuesta">
        ${e.unidad ? `<span class="unit">${esc(e.unidad)}</span>` : ""}
        <button type="button" class="btn" id="chk">Comprobar</button>
      </div>`;
    const ans = exb.querySelector("#ans"), chk = exb.querySelector("#chk");
    const go = () => {
      if (hecho) return;
      const v = parseFloat(ans.value.replace(",", "."));
      if (isNaN(v)) { msg("Escribí un número para comprobar.", "mid"); return; }
      intentos++;
      if (Math.abs(v - e.resp) <= e.tol) {
        ans.disabled = chk.disabled = true;
        msg(intentos === 1 ? "¡Correcto, a la primera!" : "¡Correcto! Lo lograste en el segundo intento.", "ok");
        fin(intentos === 1 ? 1 : .5, `respuesta ${v}`);
      } else if (intentos === 1) {
        msg(`Todavía no. Pista: ${esc(e.pista)} Probá de nuevo.`, "bad");
        decir("Mirá la pista y probá otra vez 💪");
        ans.select();
      } else {
        ans.disabled = chk.disabled = true;
        msg(`No era esa. La respuesta correcta es ${e.resp} ${esc(e.unidad || "")}. Pista: ${esc(e.pista)}`, "bad");
        fin(0, `respuesta ${v}`);
      }
    };
    chk.onclick = go;
    ans.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
    ans.focus();

  } else { /* elegir */
    exb.innerHTML = e.op.map((t, i) => `<button type="button" class="opt" data-k="${i}"><span class="ltr">${"ABCD"[i]}</span><span>${esc(t)}</span></button>`).join("");
    const btns = [...exb.querySelectorAll(".opt")];
    btns.forEach(b => b.onclick = () => {
      if (hecho) return;
      const i = +b.dataset.k;
      intentos++;
      if (i === e.ok) {
        btns.forEach(x => x.disabled = true);
        b.classList.add("right");
        msg(intentos === 1 ? "¡Correcto, a la primera!" : "¡Correcto! Lo lograste en el segundo intento.", "ok");
        fin(intentos === 1 ? 1 : .5, e.op[i]);
      } else if (intentos === 1) {
        b.disabled = true;
        b.classList.add("wrong");
        msg(`No es esa. Pista: ${esc(e.pista)} Probá con otra.`, "bad");
        decir("Mirá la pista y probá otra vez 💪");
      } else {
        btns.forEach(x => x.disabled = true);
        b.classList.add("wrong");
        btns[e.ok].classList.add("right");
        msg(`No era esa. La correcta es ${esc(e.op[e.ok])}. ${esc(e.pista)}`, "bad");
        fin(0, e.op[i]);
      }
    });
  }
}

/* ===== 5) Resultado ===== */
function end() {
  const R = calcular();
  const w = ganador(R);
  const s = SP[w];
  const nombre = esc(user.nombre.split(" ")[0]);
  bars(R);
  st.hidden = false;
  mascota("fin", `¡Listo, ${user.nombre.split(" ")[0]}! Mirá qué especialidad te salió.`);
  window.scrollTo({ top: 0 });
  const li = a => a.map(x => `<li>${x}</li>`).join("");
  const exHTML = ejRes.map(r => {
    const ic = r.pts >= 1 ? "✅" : r.pts > 0 ? "🟡" : "❌";
    return `<li><span>${ic} ${esc(r.t)}</span><small>${Math.round(r.pts * 100)}% · ${r.intentos} intento${r.intentos > 1 ? "s" : ""} · ${r.seg} s</small></li>`;
  }).join("");
  const aviso = dCount >= CONFIG.AVISO_NEUTRO
    ? `<div class="aviso">💬 Elegiste muchas respuestas ligadas a la comunicación, el diseño y el trabajo con otras personas. No es nada malo: además de esta especialidad, quizás te interesen también carreras como Diseño, Comunicación o Administración. Charlalo con tus profesores.</div>`
    : "";

  box.innerHTML = `
    <div class="res paso">
      <div class="hero" style="background:${s.g}">
        <div class="em">${s.em}</div>
        <h2>${s.n}</h2>
        <p>${s.lema}</p>
      </div>
      <span class="tag" style="background:${s.c}">Especialidad sugerida para ${nombre}</span>
      <p>${s.d}</p>
      <h3>Qué vas a aprender</h3><ul>${li(s.ap)}</ul>
      <h3>Salidas laborales</h3><ul>${li(s.sal)}</ul>
      <h3>Cómo resolviste los mini desafíos</h3><ul class="ejlist">${exHTML}</ul>
      <div class="pics">
        <div class="contenedor img-${w}-1"></div>
        <div class="contenedor img-${w}-2"></div>
      </div>
      ${s.frase ? `<blockquote class="frase" style="border-color:${s.c}">“${s.frase[0]}”<cite>—${s.frase[1]}</cite></blockquote>` : ""}
      ${aviso}
      <p class="sub">Revisá las barras estadísticas de abajo para analizar tus afinidades generales. Te recomendamos charlar el resultado con tus profesores y familia.</p>
      <div class="acts">
        <button class="btn ghost" id="rback">← Volver a la última pregunta</button>
        <button class="btn" id="re">Volver al inicio</button>
      </div>
      <div class="contacto">
        <h3>CONTACTANOS :D *risita*</h3>
        <h4><a href="mailto:julianrafaelmeza17@gmail.com">julianrafaelmeza17@gmail.com</a></h4>
        <h5><a href="https://www.instagram.com/rafael_msanchez/">Chat con J (En mantenimiento)</a></h5>
      </div>
    </div>
  `;
  document.getElementById("re").onclick = reiniciar;
  document.getElementById("rback").onclick = () => { st.hidden = true; atras(); };
}

login();
</script>
